<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Agent Pro · HUD · 廿廿</title>
<style>
  /* ============================================================
     AI Agent Pro HUD —— master（廿廿）聊天界面（Wave 9）
     布局：顶部栏（头像/状态/朗读/画布） + 中部消息流 + 底部输入栏
     状态系统: idle / thinking / speaking / executing（顶部状态点）
     ============================================================ */
  :root {
    --cyan: #38e1ff;
    --cyan-soft: #7feeff;
    --purple: #a86bff;
    --purple-soft: #c79bff;
    --pink: #ff5fa2;
    --green: #4ade80;
    --ink: #eaf6ff;
    --ink-dim: #9fc4e6;
    --panel-bg: rgba(13, 24, 46, 0.55);
    --panel-line: rgba(80, 200, 255, 0.30);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  /* 整窗可拖动（Electron 无边框），交互元素单独 no-drag */
  body { -webkit-app-region: drag; user-select: none; }
  button, input, .no-drag, #chat-list, #chip-canvas { -webkit-app-region: no-drag; }

  /* 浏览器预览背景（Electron 中 body.electron 保持透明，实现桌面悬浮叠加） */
  body:not(.electron) {
    background: radial-gradient(ellipse 90% 70% at 50% 38%, #13213f 0%, #0a1122 55%, #05080f 100%);
  }

  .hud-shell {
    position: relative;
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    background: rgba(8, 15, 30, 0.42);
    border: 1px solid var(--panel-line);
    border-radius: 18px;
    overflow: hidden;
    backdrop-filter: blur(14px);
  }
  /* Electron 透明窗：主体半透明，保证桌面悬浮感 */
  body.electron .hud-shell { background: rgba(8, 15, 30, 0.62); }

  /* ---------- 顶部栏 ---------- */
  .top-bar {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 10px;
    padding: 10px 14px;
    border-bottom: 1px solid rgba(80, 200, 255, 0.16);
    background: rgba(13, 24, 46, 0.35);
  }
  .avatar {
    width: 38px; height: 38px; flex-shrink: 0;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, var(--cyan), var(--purple));
    color: #04121f; font-weight: 800; font-size: 17px;
    box-shadow: 0 0 12px rgba(56,225,255,0.45);
    position: relative;
  }
  .avatar .presence {
    position: absolute; right: -1px; bottom: -1px;
    width: 11px; height: 11px; border-radius: 50%;
    background: var(--green); border: 2px solid #0a1428;
    box-shadow: 0 0 6px var(--green);
  }
  .who { display: flex; flex-direction: column; line-height: 1.25; }
  .who .name { font-size: 14px; font-weight: 700; color: #fff; letter-spacing: 0.5px; }
  .who .role { font-size: 10.5px; color: var(--ink-dim); letter-spacing: 0.5px; }

  .status-chip {
    display: flex; align-items: center; gap: 6px;
    margin-left: 4px;
    padding: 4px 11px;
    font-size: 11px; color: var(--ink-dim);
    background: rgba(56,225,255,0.08);
    border: 1px solid var(--panel-line);
    border-radius: 14px;
  }
  .status-chip .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--cyan); box-shadow: 0 0 6px var(--cyan);
    transition: background 0.3s, box-shadow 0.3s;
  }
  body[data-state="thinking"] .status-chip .dot { background: var(--purple); box-shadow: 0 0 6px var(--purple); animation: blink 1s step-end infinite; }
  body[data-state="executing"] .status-chip .dot { background: var(--pink); box-shadow: 0 0 6px var(--pink); animation: blink 0.8s step-end infinite; }
  body[data-state="speaking"] .status-chip .dot { background: var(--cyan-soft); box-shadow: 0 0 6px var(--cyan-soft); }
  @keyframes blink { 50% { opacity: 0.3; } }

  .top-spacer { flex: 1; }

  .icon-btn {
    width: 32px; height: 32px; flex-shrink: 0;
    border-radius: 50%;
    border: 1px solid var(--panel-line);
    background: rgba(56,225,255,0.08);
    color: var(--cyan-soft);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    transition: all 0.25s;
  }
  .icon-btn:hover { background: rgba(56,225,255,0.22); box-shadow: 0 0 10px rgba(56,225,255,0.35); }
  .icon-btn.off { color: var(--ink-dim); opacity: 0.55; }

  .chip-canvas {
    display: flex; align-items: center; gap: 6px;
    padding: 5px 11px;
    font-size: 11px; color: var(--ink-dim);
    background: rgba(168,107,255,0.08);
    border: 1px solid var(--panel-line);
    border-radius: 14px;
    cursor: pointer;
    transition: all 0.25s;
    white-space: nowrap;
  }
  .chip-canvas:hover { border-color: var(--purple); color: var(--ink); }
  .chip-canvas .led { width: 6px; height: 6px; border-radius: 50%; background: var(--purple); box-shadow: 0 0 6px var(--purple); }
  .chip-canvas .led.warn { background: #fbbf24; box-shadow: 0 0 6px #fbbf24; }

  /* ---------- 消息流 ---------- */
  #chat-list {
    flex: 1;
    overflow-y: auto;
    padding: 16px 16px 8px;
    display: flex; flex-direction: column; gap: 10px;
    user-select: text;
    scroll-behavior: smooth;
  }
  #chat-list::-webkit-scrollbar { width: 6px; }
  #chat-list::-webkit-scrollbar-thumb { background: rgba(80,200,255,0.25); border-radius: 3px; }
  #chat-list::-webkit-scrollbar-track { background: transparent; }

  .msg { display: flex; max-width: 100%; }
  .msg.user { justify-content: flex-end; }
  .msg.ai { justify-content: flex-start; }

  .bubble {
    max-width: 78%;
    padding: 9px 13px;
    border-radius: 14px;
    font-size: 13px;
    line-height: 1.55;
    word-break: break-word;
    white-space: normal;
  }
  .msg.user .bubble {
    background: linear-gradient(135deg, rgba(56,225,255,0.85), rgba(168,107,255,0.85));
    color: #04121f;
    font-weight: 600;
    border-bottom-right-radius: 4px;
    box-shadow: 0 2px 10px rgba(56,225,255,0.25);
  }
  .msg.ai .bubble {
    background: rgba(20, 34, 62, 0.85);
    border: 1px solid rgba(80, 200, 255, 0.22);
    color: var(--ink);
    border-bottom-left-radius: 4px;
  }
  /* 任务回执/聚合（📨/📋/🧩 开头）加一条强调边；失败红色 */
  .msg.ai .bubble.notice { border-left: 3px solid var(--purple); }
  .msg.ai .bubble.error { border-left: 3px solid #f87171; }

  .bubble code {
    font-family: "Cascadia Code", "Consolas", monospace;
    font-size: 12px;
    background: rgba(56,225,255,0.14);
    padding: 1px 5px; border-radius: 4px;
    color: var(--cyan-soft);
  }
  .bubble pre.code {
    display: block;
    margin: 7px 0;
    padding: 9px 11px;
    background: rgba(4, 10, 22, 0.9);
    border: 1px solid rgba(80,200,255,0.18);
    border-radius: 8px;
    font-family: "Cascadia Code", "Consolas", monospace;
    font-size: 11.5px;
    line-height: 1.5;
    color: var(--cyan-soft);
    white-space: pre-wrap;
    word-break: break-all;
    overflow-x: auto;
  }
  .bubble strong { color: #fff; }

  /* 空状态提示 */
  .empty-hint {
    margin: auto;
    text-align: center;
    color: var(--ink-dim);
    font-size: 12.5px;
    line-height: 2;
    opacity: 0.75;
  }
  .empty-hint .big { font-size: 30px; display: block; margin-bottom: 6px; }

  /* 正在输入指示（流式占位，子步B启用） */
  .msg.ai .bubble.streaming::after {
    content: "▍";
    color: var(--cyan);
    animation: blink 1s step-end infinite;
  }

  /* ---------- 底部输入栏 ---------- */
  .input-bar {
    flex-shrink: 0;
    display: flex; align-items: center; gap: 9px;
    padding: 10px 14px 12px;
    border-top: 1px solid rgba(80, 200, 255, 0.16);
    background: rgba(13, 24, 46, 0.35);
  }
  .voice-btn {
    width: 38px; height: 38px; flex-shrink: 0;
    border-radius: 50%;
    border: 1px solid var(--panel-line);
    background: rgba(56,225,255,0.10);
    color: var(--cyan-soft);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.3s;
  }
  .voice-btn:hover { background: rgba(56,225,255,0.24); box-shadow: 0 0 12px rgba(56,225,255,0.4); }
  .voice-btn.recording {
    background: rgba(255,95,162,0.2);
    border-color: var(--pink); color: var(--pink);
    animation: blink 1.1s ease-in-out infinite;
  }
  #input {
    flex: 1;
    background: rgba(4, 10, 22, 0.6);
    border: 1px solid var(--panel-line);
    border-radius: 20px;
    outline: none;
    padding: 9px 16px;
    color: var(--ink); font-size: 13.5px;
    font-family: inherit;
    transition: border-color 0.25s, box-shadow 0.25s;
  }
  #input:focus { border-color: var(--cyan); box-shadow: 0 0 10px rgba(56,225,255,0.25); }
  #input::placeholder { color: rgba(159,196,230,0.5); }
  .send-btn {
    width: 38px; height: 38px; flex-shrink: 0;
    border-radius: 50%; border: none;
    background: linear-gradient(135deg, var(--cyan), var(--purple));
    color: #04121f;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: transform 0.2s, box-shadow 0.3s;
  }
  .send-btn:hover { transform: scale(1.06); box-shadow: 0 0 14px rgba(56,225,255,0.5); }

  /* ---------- 演示控制条（仅浏览器预览） ---------- */
  .demo-bar {
    position: fixed; bottom: 0; left: 0; right: 0;
    display: flex; gap: 8px; justify-content: center;
    padding: 6px; background: rgba(0,0,0,0.5); z-index: 99;
  }
  .demo-bar button {
    padding: 4px 12px; font-size: 12px; cursor: pointer;
    background: #1a2b4d; color: var(--ink); border: 1px solid var(--panel-line);
    border-radius: 6px;
  }
  .demo-bar button.on { background: var(--cyan); color: #04121f; }
  body.electron .demo-bar { display: none; }
</style>
</head>
<body data-state="idle">
  <div class="hud-shell">
    <!-- 顶部栏 -->
    <div class="top-bar">
      <div class="avatar">廿<span class="presence"></span></div>
      <div class="who">
        <span class="name" id="who-name">廿廿</span>
        <span class="role">指挥官 · master</span>
      </div>
      <div class="status-chip"><span class="dot"></span><span id="status-label">待命中</span></div>
      <div class="top-spacer"></div>
      <button class="icon-btn" id="tts-btn" title="朗读 AI 回复（开/关）">🔊</button>
      <div class="chip-canvas" id="chip-canvas" title="展开成画布"><span class="led" id="led-canvas"></span><span id="chip-canvas-text">画布 · default</span></div>
    </div>

    <!-- 消息流 -->
    <div id="chat-list">
      <div class="empty-hint" id="empty-hint">
        <span class="big">🌙</span>
        主人，还没有对话记录<br>直接输入，或点语音和我聊聊吧
      </div>
    </div>

    <!-- 底部输入栏 -->
    <div class="input-bar">
      <button class="voice-btn" id="voice-btn" title="语音输入">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
      </button>
      <input id="input" type="text" placeholder="和廿廿说话，任务会自动派发…（/ 选择技能）" />
      <button class="send-btn" id="send-btn" title="发送">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
      </button>
    </div>
  </div>

  <!-- 浏览器预览演示控制条 -->
  <div class="demo-bar" id="demo-bar">
    <button data-demo="idle" class="on">待命</button>
    <button data-demo="thinking">思考</button>
    <button data-demo="speaking">说话</button>
    <button data-demo="executing">执行</button>
  </div>

<script>
(function () {
  "use strict";
  var bridge = window.nodeBridge || null;
  if (bridge) document.body.classList.add('electron');

  var els = {
    body: document.body,
    statusLabel: document.getElementById('status-label'),
    chatList: document.getElementById('chat-list'),
    emptyHint: document.getElementById('empty-hint'),
    input: document.getElementById('input'),
    sendBtn: document.getElementById('send-btn'),
    voiceBtn: document.getElementById('voice-btn'),
    ttsBtn: document.getElementById('tts-btn'),
    chipCanvas: document.getElementById('chip-canvas'),
    chipCanvasText: document.getElementById('chip-canvas-text'),
    ledCanvas: document.getElementById('led-canvas'),
    whoName: document.getElementById('who-name')
  };

  // ---------- 状态（顶部状态点 + 文案） ----------
  var STATE_LABEL = { idle: '待命中', thinking: '思考中', speaking: '播报中', executing: '执行中' };
  var currentState = 'idle';
  var _thinkGuard = null;
  function armThinkGuard() {
    clearThinkGuard();
    // 45 秒无状态更新自动复位，避免永远卡在「思考中」
    _thinkGuard = setTimeout(function () {
      if (currentState === 'thinking') setState('idle', { text: '响应超时' });
    }, 45000);
  }
  function clearThinkGuard() { if (_thinkGuard) { clearTimeout(_thinkGuard); _thinkGuard = null; } }

  function setState(state, opts) {
    opts = opts || {};
    if (!STATE_LABEL[state]) state = 'idle';
    currentState = state;
    els.body.setAttribute('data-state', state);
    if (state === 'thinking') armThinkGuard(); else clearThinkGuard();
    els.statusLabel.textContent = (opts.text && state !== 'idle') ? opts.text : STATE_LABEL[state];
  }

  // ---------- 文本格式化（轻量 Markdown：转义 + 代码块 + 行内代码 + 加粗 + 换行） ----------
  function esc(s) {
    return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }
  function fmt(s) {
    s = esc(s);
    var parts = s.split('```');
    var out = '';
    for (var i = 0; i < parts.length; i++) {
      if (i % 2 === 1) {
        out += '<pre class="code">' + parts[i].replace(/^\n/, '') + '</pre>';
      } else {
        var t = parts[i];
        t = t.replace(/`([^`\n]+)`/g, '<code>$1</code>');
        t = t.replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>');
        t = t.replace(/\n/g, '<br>');
        out += t;
      }
    }
    return out;
  }

  // ---------- 聊天渲染 ----------
  var _seenCount = -1;   // -1 = 首次同步（不朗读历史）
  function noticeClass(content) {
    if (/^⚠️/.test(content)) return ' error';
    if (/^(📨|📋|🧩)/.test(content)) return ' notice';
    return '';
  }
  function renderChat(chat) {
    var msgs = (chat && chat.messages) || [];
    if (chat && chat.title) els.whoName.textContent = chat.title;

    // 是否贴近底部（贴近才自动滚动，避免打扰上滑阅读）
    var nearBottom = (els.chatList.scrollHeight - els.chatList.scrollTop - els.chatList.clientHeight) < 90;

    if (msgs.length === 0) {
      els.chatList.innerHTML = '';
      els.chatList.appendChild(els.emptyHint);
      els.emptyHint.style.display = '';
      _seenCount = 0;
      return;
    }
    els.emptyHint.style.display = 'none';

    var html = '';
    for (var i = 0; i < msgs.length; i++) {
      var m = msgs[i];
      var cls = m.role === 'user' ? 'user' : 'ai';
      var extra = (m.role === 'user') ? '' : noticeClass(m.content);
      html += '<div class="msg ' + cls + '"><div class="bubble' + extra + '">' + fmt(m.content) + '</div></div>';
    }
    els.chatList.innerHTML = html;
    if (nearBottom || _seenCount < 0) els.chatList.scrollTop = els.chatList.scrollHeight;

    // 朗读新增的 AI 消息（首次同步不读历史）
    if (_seenCount >= 0 && msgs.length > _seenCount) {
      for (var j = _seenCount; j < msgs.length; j++) {
        if (msgs[j].role === 'ai') speak(msgs[j].content);
      }
    }
    _seenCount = msgs.length;
  }

  // ---------- TTS 朗读（Web Speech API，本地离线） ----------
  var ttsEnabled = true;
  var _zhVoice = null;
  function pickVoice() {
    try {
      var vs = window.speechSynthesis.getVoices();
      for (var i = 0; i < vs.length; i++) {
        if (/zh|Chinese/i.test(vs[i].lang || vs[i].name)) { _zhVoice = vs[i]; return; }
      }
    } catch (e) { /* noop */ }
  }
  if (window.speechSynthesis) {
    pickVoice();
    window.speechSynthesis.onvoiceschanged = pickVoice;
  }
  function ttsText(s) {
    s = String(s);
    s = s.replace(/```[\s\S]*?```/g, '。代码已省略。');
    s = s.replace(/`/g, '').replace(/\*\*/g, '').replace(/#{1,6}\s*/g, '');
    // 去掉常见 emoji，避免朗读怪音
    s = s.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}]/gu, '');
    s = s.replace(/\s+/g, ' ').trim();
    if (s.length > 800) s = s.substring(0, 800) + '。内容较长，朗读已截取。';
    return s;
  }
  function speak(text) {
    if (!ttsEnabled || !window.speechSynthesis) return;
    var t = ttsText(text);
    if (!t) return;
    try {
      window.speechSynthesis.cancel();
      var u = new SpeechSynthesisUtterance(t);
      u.lang = 'zh-CN';
      if (_zhVoice) u.voice = _zhVoice;
      u.rate = 1.0; u.pitch = 1.05;
      window.speechSynthesis.speak(u);
    } catch (e) { /* noop */ }
  }
  els.ttsBtn.addEventListener('click', function () {
    ttsEnabled = !ttsEnabled;
    els.ttsBtn.textContent = ttsEnabled ? '🔊' : '🔇';
    els.ttsBtn.classList.toggle('off', !ttsEnabled);
    if (!ttsEnabled && window.speechSynthesis) { try { window.speechSynthesis.cancel(); } catch (e) {} }
  });

  // ---------- 画布 chip（Wave 6d） ----------
  function updateCanvasChip(c) {
    if (!c) return;
    var label = '画布 · ' + (c.workspace || 'default');
    if (c.running) label += ' · ' + c.running + ' 运行';
    els.chipCanvasText.textContent = label;
    els.ledCanvas.className = c.running ? 'led warn' : 'led';
  }
  els.chipCanvas.addEventListener('click', function () {
    if (bridge && bridge.ipc && bridge.ipc.send) bridge.ipc.send('hud-input', { action: 'open-canvas' });
  });

  // ---------- IPC：接收主进程中继 ----------
  if (bridge && bridge.ipc && bridge.ipc.on) {
    bridge.ipc.on('hud-state', function (payload) {
      payload = payload || {};
      // Wave 9：master 会话聊天快照（chatOnly 仅渲染聊天，不打扰状态）
      if (payload.chat) { renderChat(payload.chat); }
      if (payload.chatOnly) return;
      // Wave 6d：画布摘要
      if (payload.canvas) updateCanvasChip(payload.canvas);
      if (payload.canvasOnly) return;
      setState(payload.state || 'idle', { text: payload.text });
    });
    if (bridge.ipc.send) bridge.ipc.send('hud-ready');
  }

  // ---------- 发送 ----------
  function submit() {
    var text = els.input.value.trim();
    if (!text) return;
    if (bridge && bridge.ipc && bridge.ipc.send) {
      bridge.ipc.send('hud-input', { text: text });
    }
    els.input.value = '';
    els.input.focus();
  }
  els.sendBtn.addEventListener('click', submit);
  els.input.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); submit(); }
  });

  // ---------- 语音按钮（状态上报，STT 由主窗口语音模块处理） ----------
  var recording = false;
  els.voiceBtn.addEventListener('click', function () {
    recording = !recording;
    els.voiceBtn.classList.toggle('recording', recording);
    if (bridge && bridge.ipc && bridge.ipc.send) {
      bridge.ipc.send('hud-voice', { recording: recording });
    }
    if (recording) setState('speaking', { text: '正在聆听' });
    else setState('idle');
  });

  // ---------- 浏览器预览演示 ----------
  var demoBar = document.getElementById('demo-bar');
  if (!bridge) {
    demoBar.addEventListener('click', function (e) {
      var btn = e.target.closest('button');
      if (!btn) return;
      demoBar.querySelectorAll('button').forEach(function (b) { b.classList.remove('on'); });
      btn.classList.add('on');
      setState(btn.getAttribute('data-demo'));
    });
    // 演示：填充几条示例消息
    renderChat({ title: '廿廿', messages: [
      { role: 'ai', content: '主人，我在待命中，随时为你效劳。', ts: Date.now() - 3000 },
      { role: 'user', content: '帮我写一段 Python 快速排序', ts: Date.now() - 2000 },
