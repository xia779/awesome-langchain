<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AI测试体 · 移动版</title>
<!-- PWA 配置（如不需要可注释掉） -->
  <!--
  <link rel="manifest" href="/manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  -->
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
      background: #0d0d1a;
      color: #e4e4e7;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 12px;
      overflow: hidden;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 10px;
      border-bottom: 1px solid #2a2a3e;
      flex-shrink: 0;
    }
    .header h1 {
      font-size: 18px;
      font-weight: 600;
      background: linear-gradient(135deg, #818cf8, #a78bfa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .header .status {
      font-size: 12px;
      color: #4ade80;
    }
    .model-selector {
      margin-top: 8px;
      padding: 6px 12px;
      background: #1e1e32;
      border: 1px solid #2a2a3e;
      border-radius: 20px;
      color: #e4e4e7;
      font-size: 13px;
      width: 100%;
      outline: none;
      flex-shrink: 0;
    }
    .web-toggle {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      color: #aaa;
      flex-shrink: 0;
      padding: 4px 0;
    }
    .web-toggle input[type="checkbox"] {
      accent-color: #818cf8;
      width: 18px;
      height: 18px;
      cursor: pointer;
    }
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 12px 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
      scroll-behavior: smooth;
      -webkit-overflow-scrolling: touch;
    }
    .msg {
      max-width: 85%;
      padding: 10px 14px;
      border-radius: 18px;
      line-height: 1.5;
      font-size: 15px;
      word-wrap: break-word;
      animation: fadeIn 0.2s ease;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .user {
      align-self: flex-end;
      background: #3b82f6;
      color: #fff;
      border-bottom-right-radius: 4px;
    }
    .ai {
      align-self: flex-start;
      background: #1e1e32;
      color: #e4e4e7;
      border-bottom-left-radius: 4px;
      border: 1px solid #2a2a3e;
    }
    .typing {
      align-self: flex-start;
      background: #1e1e32;
      padding: 12px 16px;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      display: flex;
      gap: 4px;
    }
    .typing span {
      width: 8px;
      height: 8px;
      background: #818cf8;
      border-radius: 50%;
      display: inline-block;
      animation: wave 1.2s infinite ease-in-out;
    }
    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes wave {
      0%,60%,100% { transform: translateY(0); opacity: 0.4; }
      30% { transform: translateY(-8px); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>🧠 AI测试体</h1>
    <span class="status" id="connStatus">● 已连接</span>
  </div>

  <select class="model-selector" id="modelSelect">
    <option value="qwen2.5:7b">Qwen2.5 7B</option>
    <option value="llama3.1:8b">Llama3.1 8B</option>
  </select>

  <div class="web-toggle">
    <input type="checkbox" id="webSearchToggle" />
    <label for="webSearchToggle">🌐 联网搜索</label>
  </div>

  <div id="chat-box"></div>

  <div id="status" style="font-size:12px; color:#666; text-align:center; padding-top:6px; flex-shrink:0;">✅ 已就绪</div>

  <script src="./script.js"></script>
</body>
</html>
